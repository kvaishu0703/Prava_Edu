{% extends "base.html" %}

{% block content %}
<section class="dashboard-wrap">
    <aside class="role-sidebar accent-admin">
        <div class="sidebar-brand">
            <span class="brand-mark"><i class="bi bi-mortarboard-fill"></i></span>
            <div>
                <strong>PRAVA</strong>
                <span>Admin System</span>
            </div>
        </div>
        <nav class="role-nav">
            <a href="{{ url_for('admin.dashboard') }}"><i class="bi bi-speedometer2"></i> Dashboard</a>
            <a href="{{ url_for('admin.profile') }}"><i class="bi bi-person"></i> Profile</a>
            <a href="{{ url_for('admin.students') }}"><i class="bi bi-people"></i> Students</a>
            <a href="{{ url_for('admin.faculty') }}"><i class="bi bi-person-workspace"></i> Faculty</a>
            <a href="{{ url_for('admin.courses') }}"><i class="bi bi-journal-bookmark"></i> Courses</a>
            <a href="{{ url_for('admin.subjects') }}"><i class="bi bi-book"></i> Subjects</a>
            <a href="{{ url_for('admin.notifications') }}"><i class="bi bi-bell"></i> Notifications</a>
            <a href="{{ url_for('admin.student_test_responses') }}"><i class="bi bi-ui-checks-grid"></i> Student Tests</a>
            <a href="{{ url_for('admin.contact_inquiries') }}"><i class="bi bi-envelope-paper"></i> Inquiries</a>
            <a href="{{ url_for('admin.reports') }}"><i class="bi bi-file-earmark-spreadsheet"></i> Reports</a>
            <form method="post" action="{{ url_for('auth.logout') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <button type="submit"><i class="bi bi-box-arrow-right"></i> Logout</button>
            </form>
        </nav>
    </aside>
    <div class="dashboard-main">
        {% block admin_content %}{% endblock %}
    </div>
</section>
{% endblock %}
