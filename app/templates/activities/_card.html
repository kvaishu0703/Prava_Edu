<article class="data-panel mb-3"><p class="eyebrow">{{ activity.category }}</p><h3><a href="{{ url_for('activities.detail', activity_id=activity.id) }}">{{ activity.title }}</a></h3><div class="activity-meta"><span><i class="bi bi-calendar-event"></i> {{ activity.starts_at.strftime('%d %b %Y / %I:%M %p') }} IST</span><span><i class="bi bi-geo-alt"></i> {{ activity.venue }}</span><span>{{ departments[activity.department].name if activity.department in departments else 'Both departments' }}</span></div></article>
